global:
  scrape_interval: 10s
scrape_configs:
  - job_name: agentflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
  - job_name: agentflow-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core-service:8081"]
  - job_name: agentflow-event
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-service:8082"]
