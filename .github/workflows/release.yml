name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify and package
        run: ./mvnw --batch-mode clean verify
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            services/core-service/target/agentflow-core-service-*.jar
            services/event-service/target/agentflow-event-service-*.jar
            services/gateway-service/target/agentflow-gateway-service-*.jar
            compose.yaml
            .env.example
