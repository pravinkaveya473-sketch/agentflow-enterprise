spring:
  application:
    name: agentflow-core-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agentflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:agent}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
      minimum-idle: ${MYSQL_MIN_IDLE:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      jedis:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${QWEN_MODEL:qwen-plus}
          temperature: 0.2
      embedding:
        options:
          model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
      on-client-errors: false
    vectorstore:
      redis:
        initialize-schema: ${VECTOR_STORE_INITIALIZE_SCHEMA:true}
        index-name: agentflow-rag-index
        prefix: "rag:chunk:"
        distance-metric: COSINE
        vector-algorithm: HNSW
    chat:
      memory:
        redis:
          host: ${REDIS_HOST:localhost}
          port: ${REDIS_PORT:6379}
          index-name: agentflow-chat-memory-index
          key-prefix: "agent:memory:"
          time-to-live: 7d
          initialize-schema: true
          max-messages-per-conversation: 100

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  metrics:
    tags:
      application: ${spring.application.name}

app:
  ai:
    default-zone-id: ${APP_TIME_ZONE:Asia/Shanghai}
  agent:
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:8}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:10}
    max-duration: ${AGENT_MAX_DURATION:60s}
    run-cache-ttl: ${AGENT_RUN_CACHE_TTL:24h}
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:30}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
    max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:12000}
    max-extracted-characters: ${RAG_MAX_EXTRACTED_CHARACTERS:2000000}
    allowed-extensions: [pdf, doc, docx, txt, md]
    upload-dir: ${RAG_UPLOAD_DIR:./data/uploads}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:agentflow-enterprise}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD}
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:10m}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:1m}
  approval:
    ttl: ${APPROVAL_TTL:30m}
    expiry-scan-interval: ${APPROVAL_EXPIRY_SCAN_INTERVAL:60s}
  kafka:
    task-topic: ${TASK_EVENT_TOPIC:agentflow.task.lifecycle.v1}
    outbox-publish-interval: ${OUTBOX_PUBLISH_INTERVAL:1s}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    root: INFO
    com.cjl.java_ai_agent: INFO
    org.springframework.ai: INFO
    org.springframework.security: INFO
