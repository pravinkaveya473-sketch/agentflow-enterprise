spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:agentflow-enterprise}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}

management:
  endpoint:
    health:
      show-details: never
